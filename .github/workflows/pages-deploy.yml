name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site (demo pages + compiled WASM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          target: wasm32-unknown-unknown
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked
      - name: Build Rust WASM for the browser
        run: |
          cd rust-wasm
          wasm-pack build --target web --out-dir pkg
      - name: Assemble _site (pages reference pkg/ relatively)
        run: |
          rm -rf _site && mkdir -p _site
          cp -r demo-pages/. _site/
          mkdir -p _site/pkg
          cp -r rust-wasm/pkg/. _site/pkg/
          # Go module ships prebuilt from the CI artifact path; when built
          # locally via TinyGo, copy main.wasm + wasm_exec.js next to the page.
          if [ -f go-wasm/main.wasm ]; then cp go-wasm/main.wasm go-wasm/wasm_exec.js _site/ 2>/dev/null || true; fi
          # Pages serves .wasm with application/wasm; .nojekyll keeps
          # underscore-prefixed files servable.
          touch _site/.nojekyll
          ls -la _site _site/pkg | head -30
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
