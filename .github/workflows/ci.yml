name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: 'pip' }
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Build Rust WASM
        run: |
          cd rust-wasm
          wasm-pack build --target web --out-dir pkg
      - name: Install TinyGo
        run: |
          TINYGO_VERSION=0.31.0
          curl -fsSL -o tinygo.tar.gz "https://github.com/tinygo-org/tinygo/releases/download/v${TINYGO_VERSION}/tinygo${TINYGO_VERSION}.linux-amd64.tar.gz"
          sudo tar -C /usr/local -xzf tinygo.tar.gz
          echo "/usr/local/tinygo/bin" >> "$GITHUB_PATH"
      - name: Build Go WASM
        run: |
          cd go-wasm
          tinygo build -o main.wasm -target wasm -no-debug -opt=s .
      - name: Verify demo page
        run: |
          ls -la demo-pages/index.html

      - name: Check page structure and local assets
        run: |
          python tools/check_pages.py
      - name: Check licenses
        run: |
          test -f LICENSE && echo "LICENSE present" || exit 1