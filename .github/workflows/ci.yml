name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned so a new TinyGo/Rust release cannot silently change artifacts.
  TINYGO_VERSION: "0.44.0"
  # Size budgets (bytes) — the demo pages ship these bytes to every learner.
  RUST_WASM_BUDGET: "512000"
  GO_WASM_BUDGET: "1048576"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for large files
        run: |
          find . -type f -size +50M ! -path "./.git/*" | head -20
          if [ $(find . -type f -size +50M ! -path "./.git/*" | wc -l) -gt 0 ]; then
            echo "::error::Files larger than 50MB found"
            exit 1
          fi

  static-checks:
    name: Static page checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Structural checks (nav targets, local refs, canvas alternatives)
        run: python tools/check_pages.py
      - name: Smoke tests
        run: python -m pytest tests/ -q

  wasm-rust:
    name: Build Rust WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/rustup@v1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked
      - name: Build (web target, what demo-pages imports)
        run: |
          cd rust-wasm
          wasm-pack build --target web --out-dir pkg
      - name: Size budget
        run: |
          WASM=$(ls -S rust-wasm/pkg/*_bg.wasm | head -1)
          SIZE=$(stat -c%s "$WASM")
          echo "Rust WASM: $WASM = ${SIZE} bytes (budget ${RUST_WASM_BUDGET})" >> "$GITHUB_STEP_SUMMARY"
          [ "$SIZE" -le "$RUST_WASM_BUDGET" ] || { echo "::error::Rust WASM ${SIZE}B exceeds ${RUST_WASM_BUDGET}B budget"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: rust-pkg
          path: rust-wasm/pkg/

  wasm-go:
    name: Build Go WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Standard Go build (GOOS=js GOARCH=wasm — always available)
        run: |
          cd go-wasm
          GOOS=js GOARCH=wasm go build -o main-stdlib.wasm .
          ls -la *.wasm
      - name: TinyGo build (pinned ${{ env.TINYGO_VERSION }} — what ships)
        run: |
          curl -sSL -o /tmp/tinygo.deb "https://github.com/tinygo/tinygo/releases/download/v${TINYGO_VERSION}/tinygo_${TINYGO_VERSION}_amd64.deb"
          sudo dpkg -i /tmp/tinygo.deb
          cd go-wasm
          tinygo build -o main.wasm -target wasm -no-debug -opt=s .
          cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" ./wasm_exec.js 2>/dev/null || cp "$(go env GOROOT)/misc/wasm/wasm_exec.js" ./wasm_exec.js
          ls -la *.wasm
      - name: Size budget (TinyGo artifact is what ships)
        run: |
          SIZE=$(stat -c%s go-wasm/main.wasm)
          echo "Go WASM (TinyGo): ${SIZE} bytes (budget ${GO_WASM_BUDGET}), stdlib reference: $(stat -c%s go-wasm/main-stdlib.wasm) bytes" >> "$GITHUB_STEP_SUMMARY"
          [ "$SIZE" -le "$GO_WASM_BUDGET" ] || { echo "::error::Go WASM ${SIZE}B exceeds ${GO_WASM_BUDGET}B budget"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: go-wasm
          path: |
            go-wasm/main.wasm
            go-wasm/wasm_exec.js

  summary:
    name: Summary
    needs: [lint, static-checks, wasm-rust, wasm-go]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check status
        run: |
          echo "Lint: ${{ needs.lint.result }}"
          echo "Static checks: ${{ needs.static-checks.result }}"
          echo "Rust WASM: ${{ needs.wasm-rust.result }}"
          echo "Go WASM: ${{ needs.wasm-go.result }}"
          if [[ "${{ needs.lint.result }}" != "success" ]] || [[ "${{ needs.static-checks.result }}" != "success" ]] || [[ "${{ needs.wasm-rust.result }}" != "success" ]] || [[ "${{ needs.wasm-go.result }}" != "success" ]]; then
            exit 1
          fi
