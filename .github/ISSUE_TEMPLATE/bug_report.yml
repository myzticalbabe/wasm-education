name: Bug report
description: Something renders, computes, or behaves incorrectly.
title: "[Bug] "
labels: ["bug"]
body:
  - type: input
    id: page
    attributes:
      label: Page
      placeholder: demo-pages/kids-index.html
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: Console errors and screenshots help.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Word Web
        2. Activate Schema
        3. Unlock Level
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Where
      options:
        - GitHub Pages (live demo)
        - Local file://
        - Local http-server
        - Other
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
    validations:
      required: true
