[package]
name = "wasm_education"
version = "0.1.0"
edition = "2021"
description = "Educational WASM modules for cognitive/semantic learning — Rust & Go"
license = "SOUL_FORGE-1.0"
repository = "https://github.com/myzticalbabe/wasm-education"
categories = ["education", "wasm", "visualization", "science"]
keywords = ["education", "wasm", "cognitive", "semantic", "rust", "go"]

[lib]
crate-type = ["cdylib", "rlib"]
name = "wasm_education"

[dependencies]
wasm-bindgen = { version = "0.2", features = ["serde-serialize"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
web-sys = { version = "0.3", features = [
    "Document", "Element", "HtmlElement", "CanvasRenderingContext2d",
    "Window", "console", "EventTarget", "MouseEvent", "KeyboardEvent",
    "HtmlCanvasElement"
] }
rand = { version = "0.8", features = ["std", "std_rng"] }
# `rand` pulls entropy from getrandom; on wasm32 that needs the `js` backend.
getrandom = { version = "0.2", features = ["js"] }
nalgebra = { version = "0.32", features = ["serde-serialize"] }
petgraph = { version = "0.6", features = ["serde-1", "stable_graph"] }
fixedbitset = "0.5"
console_error_panic_hook = { version = "0.1", optional = true }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"

[features]
default = ["console_error_panic_hook"]
console_error_panic_hook = ["dep:console_error_panic_hook"]